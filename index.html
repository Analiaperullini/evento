<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1828" />
    <link rel="icon" type="image/png" href="icono-ctj.png" />
    <meta name="robots" content="noindex" />
    <title>Gran Cena Show · Día del Técnico</title>
    <!--
      Página fija a la que apunta el QR del portal (GitHub Pages).
      Lee destino.json (que actualiza el servidor al arrancar) y redirige al
      portal. Así el QR impreso nunca cambia aunque cambie la dirección del túnel.
    -->
    <style>
      /* Identidad de la Gran Cena Show · Día del Técnico: crema, dorado y negro */
      :root { --cream: #fbf7ee; --gold: #c09a49; --gold-dark: #8f6e2a; --ink: #27251c; --navy: #0d1828; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--cream); color: var(--ink); text-align: center;
      }
      body::before { content: ""; position: fixed; inset: 10px; border: 1px solid var(--gold); border-radius: 6px; pointer-events: none; }
      .box { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
      .logo { height: 46px; width: auto; }
      .spinner { margin: 0 auto 12px; width: 40px; height: 40px; border-radius: 50%; border: 4px solid #ecdfbf; border-top-color: var(--gold); animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 800; font-size: 22px; margin: 0; }
      .script { font-family: Georgia, serif; font-style: italic; color: var(--gold-dark); font-size: 20px; }
      p { margin: 0; color: #5a5446; line-height: 1.4; }
      button { font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; cursor: pointer; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo" src="logo-ctj.png" alt="Colegio de Técnicos de Jujuy" />
      <div class="script">Gran Cena Show · Día del Técnico</div>
      <div id="cargando">
        <div class="spinner"></div>
        <h1>Abriendo el portal del evento…</h1>
      </div>
      <div id="offline" hidden>
        <h1>El portal no está disponible en este momento</h1>
        <p>Probá de nuevo en unos minutos. Esta página se vuelve a intentar sola.</p>
        <button type="button" onclick="intentar()">Reintentar</button>
      </div>
    </div>
    <script>
      // ?p=/galeria permite apuntar a una sección específica del portal
      var destinoRuta = new URLSearchParams(location.search).get("p") || "/";
      if (destinoRuta.charAt(0) !== "/") destinoRuta = "/";
      var reintento = null;

      function mostrar(estado) {
        document.getElementById("cargando").hidden = estado !== "cargando";
        document.getElementById("offline").hidden = estado !== "offline";
      }

      function conTimeout(url, ms) {
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, ms);
        return fetch(url, { cache: "no-store", signal: ctrl.signal }).finally(function () { clearTimeout(t); });
      }

      function intentar() {
        clearTimeout(reintento);
        mostrar("cargando");
        conTimeout("destino.json?t=" + Date.now(), 8000)
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var base = (d && d.url ? String(d.url) : "").replace(/\/+$/, "");
            if (!/^https:\/\//.test(base)) throw new Error("sin destino");
            // Se verifica que el servidor responda antes de redirigir
            return conTimeout(base + "/api/health", 8000).then(function (r) {
              if (!r.ok) throw new Error("servidor caído");
              location.replace(base + destinoRuta);
            });
          })
          .catch(function () {
            mostrar("offline");
            reintento = setTimeout(intentar, 15000);
          });
      }

      intentar();
    </script>
  </body>
</html>
